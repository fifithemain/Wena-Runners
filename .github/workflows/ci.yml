name: WENA v3 build
on:
  push:
    branches: [main, feat/integrated-marketing-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wena-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Regenerate and commit pnpm lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/feat/integrated-marketing-foundation" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git commit -m "build: sync pnpm lockfile with patched dependencies"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - run: pnpm install --frozen-lockfile
      - name: Report dependency security advisories
        run: |
          pnpm audit --json > pnpm-audit.json || true
          node <<'NODE'
          const audit = require('./pnpm-audit.json');
          const summary = audit.metadata?.vulnerabilities || audit.vulnerabilities || {};
          console.log('Dependency audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
            console.log(name + ': ' + item.severity + ' | ' + (item.title || item.name || 'advisory'));
          }
          NODE
      - run: pnpm run build
