<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64">
  <style>
    .route-base{fill:none;stroke:#dce5d8;stroke-width:3;stroke-linecap:round}
    .route-trail{fill:none;stroke:#77a47c;stroke-width:3;stroke-linecap:round;stroke-dasharray:5 9;animation:route-travel 1.1s linear infinite}
    .stop{fill:#d5e4d2;stroke:#fff;stroke-width:3}
    .runner-head{fill:#c77c4c}
    .runner-body{fill:#008b57}
    .runner-legs,.runner-arms{fill:none;stroke:#008b57;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .runner-box{fill:#d6a765;stroke:#805b2c;stroke-width:1}
    .runner-box-detail{fill:none;stroke:#805b2c;stroke-width:1;stroke-linejoin:round}
    .runner-static{display:none}
    @keyframes route-travel{to{stroke-dashoffset:-28}}
    @media(prefers-reduced-motion:reduce){.route-trail{animation:none}.runner-moving{display:none}.runner-static{display:block}}
  </style>
  <path class="route-base" d="M18 42 C56 42 58 14 98 14 S138 50 176 50 S198 28 222 28"/>
  <path class="route-trail" d="M18 42 C56 42 58 14 98 14 S138 50 176 50 S198 28 222 28"/>
  <circle class="stop" cx="18" cy="42" r="4"/>
  <circle class="stop" cx="98" cy="14" r="4"/>
  <circle class="stop" cx="176" cy="50" r="4"/>
  <g class="runner-moving">
    <animateMotion dur="3.2s" path="M18 42 C56 42 58 14 98 14 S138 50 176 50 S198 28 222 28" rotate="auto" repeatCount="indefinite"/>
    <path class="runner-legs" d="m-3 3-5 7-5 1m10-7 5 6-2 5"/>
    <circle class="runner-head" cx="-3" cy="-11" r="4"/>
    <path class="runner-body" d="M-7-6q4-3 8 1l4 7-5 4-8-5z"/>
    <path class="runner-arms" d="m-5-4 8 2 4-3"/>
    <rect class="runner-box" x="4" y="-9" width="15" height="13" rx="1.5"/>
    <path class="runner-box-detail" d="m4-5 7 3 8-3m-8 3v9m0-9 3-5"/>
  </g>
  <g class="runner-static" transform="translate(18 42)">
    <path class="runner-legs" d="m-3 3-5 7-5 1m10-7 5 6-2 5"/>
    <circle class="runner-head" cx="-3" cy="-11" r="4"/>
    <path class="runner-body" d="M-7-6q4-3 8 1l4 7-5 4-8-5z"/>
    <path class="runner-arms" d="m-5-4 8 2 4-3"/>
    <rect class="runner-box" x="4" y="-9" width="15" height="13" rx="1.5"/>
    <path class="runner-box-detail" d="m4-5 7 3 8-3m-8 3v9m0-9 3-5"/>
  </g>
</svg>
